<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Solo workflow: plan, test first for bug fixes, build, verify, review, commit, push and pull request, with who acts and where something blocks" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>Solo workflow: plan, test first for bug fixes, build, verify, review, commit, push and pull request, with who acts and where something blocks</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9da7b3"/></marker><marker id="arrow-entry" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3b341"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0883e"/></marker><marker id="arrow-changes" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker><marker id="arrow-hook" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker></defs>
<rect x="1" y="1" width="1198" height="618" rx="16" fill="#0d1117" stroke="#3d444d" stroke-width="2"/>
<text x="37" y="48" font-size="24" font-weight="700" fill="#e6edf3">Solo: one owner who reads every diff</text>
<text x="37" y="72" font-size="14" fill="#9da7b3">Light: advice and warnings. You approve the plan, ask for the commit, push and merge. Only the hooks you install block.</text>
<line x1="12" y1="238" x2="58" y2="238" stroke="#e3b341" stroke-width="1.8" marker-end="url(#arrow-entry)"/>
<text x="12" y="230" font-size="11.5" font-weight="700" fill="#e3b341">you ask</text>
<text x="120" y="110" text-anchor="middle" font-size="12" fill="#9da7b3">you approve the</text>
<text x="120" y="125" text-anchor="middle" font-size="12" fill="#9da7b3">anchor, the bucket</text>
<text x="120" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">map and each bucket</text>
<text x="120" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">plan. Routine work</text>
<text x="120" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">is exempt</text>
<rect x="62" y="196" width="116" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="120" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Plan</text>
<text x="120" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">Intent Anchor</text>
<rect x="70" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="82.5" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<rect x="100" y="187" width="32" height="17" rx="8.5" fill="#e3b341"/><text x="116" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">YOU</text>
<line x1="181" y1="238" x2="198.28571428571428" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="260.2857142857143" y="110" text-anchor="middle" font-size="12" fill="#9da7b3">a bug fix starts</text>
<text x="260.2857142857143" y="125" text-anchor="middle" font-size="12" fill="#9da7b3">with a failing test,</text>
<text x="260.2857142857143" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">shown failing. New</text>
<text x="260.2857142857143" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">logic only if the</text>
<text x="260.2857142857143" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">bucket says TDD: yes</text>
<rect x="202.28571428571428" y="196" width="116" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="260.2857142857143" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Test first</text>
<text x="260.2857142857143" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">bug fixes, TDD</text>
<text x="260.2857142857143" y="266" text-anchor="middle" font-size="12" fill="#9da7b3">buckets</text>
<rect x="210.28571428571428" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="222.78571428571428" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<line x1="321.2857142857143" y1="238" x2="338.57142857142856" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="400.57142857142856" y="110" text-anchor="middle" font-size="12" fill="#9da7b3">router and always-on</text>
<text x="400.57142857142856" y="125" text-anchor="middle" font-size="12" fill="#9da7b3">rules. Change the</text>
<text x="400.57142857142856" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">code, never the</text>
<text x="400.57142857142856" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">test. Test guard is</text>
<text x="400.57142857142856" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">off</text>
<rect x="342.57142857142856" y="196" width="116" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="400.57142857142856" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Build</text>
<text x="400.57142857142856" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">makes the test</text>
<text x="400.57142857142856" y="266" text-anchor="middle" font-size="12" fill="#9da7b3">pass</text>
<rect x="350.57142857142856" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="363.07142857142856" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<line x1="461.57142857142856" y1="238" x2="478.85714285714283" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="540.8571428571429" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">the assistant runs</text>
<text x="540.8571428571429" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">them and shows the</text>
<text x="540.8571428571429" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">real output</text>
<rect x="482.85714285714283" y="196" width="116" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="540.8571428571429" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Verify</text>
<text x="540.8571428571429" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">lint, types,</text>
<text x="540.8571428571429" y="266" text-anchor="middle" font-size="12" fill="#9da7b3">whole suite</text>
<rect x="490.85714285714283" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="503.35714285714283" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<line x1="601.8571428571429" y1="238" x2="619.1428571428571" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="681.1428571428571" y="125" text-anchor="middle" font-size="12" fill="#9da7b3">reviewer subagent on</text>
<text x="681.1428571428571" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">the staged change.</text>
<text x="681.1428571428571" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">You read the diff</text>
<text x="681.1428571428571" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">too</text>
<rect x="623.1428571428571" y="196" width="116" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="681.1428571428571" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Review</text>
<text x="681.1428571428571" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">advisory</text>
<rect x="631.1428571428571" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="643.6428571428571" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<line x1="742.1428571428571" y1="238" x2="759.4285714285713" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="821.4285714285713" y="110" text-anchor="middle" font-size="12" fill="#9da7b3">you ask for it.</text>
<text x="821.4285714285713" y="125" text-anchor="middle" font-size="12" fill="#9da7b3">Hook: lint, types,</text>
<text x="821.4285714285713" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">tests. Docs check</text>
<text x="821.4285714285713" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">only warns. You give</text>
<text x="821.4285714285713" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">the changelog line</text>
<rect x="763.4285714285713" y="196" width="116" height="84" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="821.4285714285713" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Commit</text>
<text x="821.4285714285713" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">hook gate</text>
<rect x="771.4285714285713" y="187" width="32" height="17" rx="8.5" fill="#e3b341"/><text x="787.4285714285713" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">YOU</text>
<rect x="808.4285714285713" y="187" width="32" height="17" rx="8.5" fill="#3fb950"/><text x="824.4285714285713" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">RUN</text>
<rect x="833.4285714285713" y="271" width="38" height="17" rx="8.5" fill="#f85149"/><text x="852.4285714285713" y="283.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">HARD</text>
<line x1="882.4285714285713" y1="238" x2="899.7142857142856" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="961.7142857142857" y="110" text-anchor="middle" font-size="12" fill="#9da7b3">you push, never the</text>
<text x="961.7142857142857" y="125" text-anchor="middle" font-size="12" fill="#9da7b3">assistant. Protected</text>
<text x="961.7142857142857" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">branch refused.</text>
<text x="961.7142857142857" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">Review: a reminder</text>
<text x="961.7142857142857" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">only</text>
<rect x="903.7142857142857" y="196" width="116" height="84" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="961.7142857142857" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Push</text>
<text x="961.7142857142857" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">hook gate</text>
<rect x="911.7142857142857" y="187" width="32" height="17" rx="8.5" fill="#e3b341"/><text x="927.7142857142857" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">YOU</text>
<rect x="948.7142857142857" y="187" width="32" height="17" rx="8.5" fill="#3fb950"/><text x="964.7142857142857" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">RUN</text>
<rect x="973.7142857142857" y="271" width="38" height="17" rx="8.5" fill="#f85149"/><text x="992.7142857142857" y="283.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">HARD</text>
<line x1="1022.7142857142857" y1="238" x2="1040" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1102" y="110" text-anchor="middle" font-size="12" fill="#9da7b3">assistant drafts the</text>
<text x="1102" y="125" text-anchor="middle" font-size="12" fill="#9da7b3">text. You open it,</text>
<text x="1102" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">CI runs, you merge.</text>
<text x="1102" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">You merge the</text>
<text x="1102" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">release PR</text>
<rect x="1044" y="196" width="116" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="1102" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Pull request</text>
<text x="1102" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">drafted, merged</text>
<text x="1102" y="266" text-anchor="middle" font-size="12" fill="#9da7b3">by you</text>
<rect x="1052" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="1064.5" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<rect x="1082" y="187" width="32" height="17" rx="8.5" fill="#e3b341"/><text x="1098" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">YOU</text>
<rect x="1119" y="187" width="32" height="17" rx="8.5" fill="#3fb950"/><text x="1135" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">RUN</text>
<path d="M 540.8571428571429 282 V 324 H 400.57142857142856 V 284" fill="none" stroke="#f0883e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-fail)"/>
<text x="424.57142857142856" y="341" font-size="12.5" fill="#f0883e">FAIL: the assistant gets the log and</text>
<text x="424.57142857142856" y="356" font-size="12.5" fill="#f0883e">fixes it</text>
<path d="M 681.1428571428571 282 V 372 H 383.57142857142856 V 284" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-changes)"/>
<text x="424.57142857142856" y="389" font-size="12.5" fill="#58a6ff">CHANGES: a blocking finding is fixed, then reviewed again</text>
<path d="M 821.4285714285713 282 V 420 H 366.57142857142856 V 284" fill="none" stroke="#f85149" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-hook)"/>
<text x="424.57142857142856" y="437" font-size="12.5" fill="#f85149">HOOK FAILS: the commit is blocked, fix and commit again</text>
<rect x="37" y="484" width="32" height="17" rx="8.5" fill="#e3b341"/><text x="53" y="496.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">YOU</text>
<text x="79" y="497" font-size="12.5" fill="#9da7b3">a person decides or acts: approves, asks, pushes, merges</text>
<rect x="597" y="484" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="609.5" y="496.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<text x="632" y="497" font-size="12.5" fill="#9da7b3">the assistant, working under the rules and skills</text>
<rect x="37" y="510" width="32" height="17" rx="8.5" fill="#3fb950"/><text x="53" y="522.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">RUN</text>
<text x="79" y="523" font-size="12.5" fill="#9da7b3">a script, a git hook or a CI job</text>
<rect x="597" y="510" width="38" height="17" rx="8.5" fill="#f85149"/><text x="616" y="522.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">HARD</text>
<text x="645" y="523" font-size="12.5" fill="#9da7b3">something blocks (only where the hook or tool is installed)</text>
<rect x="37" y="536" width="34" height="17" rx="6" fill="none" stroke="#9da7b3" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="81" y="549" font-size="12.5" fill="#9da7b3">dashed box: happens only in some cases (the note says when)</text>
<text x="37" y="576" font-size="12.5" fill="#9da7b3">In no profile does anything push, open a pull request or merge by itself. The profile changes how much a machine blocks, not whether a person decides.</text>
</svg>
