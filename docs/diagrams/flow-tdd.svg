<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Test-first and bug-fix path: reproduce as a failing test, show it failing, lock the tests, change only the code, show it passing, stop fix mode" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title>Test-first and bug-fix path: reproduce as a failing test, show it failing, lock the tests, change only the code, show it passing, stop fix mode</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9da7b3"/></marker><marker id="arrow-entry" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3b341"/></marker><marker id="arrow-wrong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3b341"/></marker><marker id="arrow-again" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0883e"/></marker></defs>
<rect x="1" y="1" width="1198" height="698" rx="16" fill="#0d1117" stroke="#3d444d" stroke-width="2"/>
<text x="37" y="48" font-size="24" font-weight="700" fill="#e6edf3">Test first and bug fixes: the test comes before the code</text>
<text x="37" y="72" font-size="14" fill="#9da7b3">A failing test is the proof. It is written first and shown failing; then only the code changes until it passes.</text>
<text x="137" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">bug fix: reproduce it as a</text>
<text x="137" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">test. New logic: one test</text>
<text x="137" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">per acceptance criterion</text>
<rect x="62" y="196" width="150" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="137" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Reproduce</text>
<text x="137" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">as a failing test</text>
<rect x="70" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="82.5" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<line x1="215" y1="238" x2="247.6" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="326.6" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">run it and show the failure.</text>
<text x="326.6" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">A test that fails for the</text>
<text x="326.6" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">wrong reason proves nothing</text>
<rect x="251.6" y="196" width="150" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="326.6" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Show it failing</text>
<text x="326.6" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">for the right reason</text>
<rect x="259.6" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="272.1" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<line x1="404.6" y1="238" x2="437.2" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="516.2" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">tests.guard on (team, org):</text>
<text x="516.2" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">from here the hook refuses</text>
<text x="516.2" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">edits to existing test files</text>
<rect x="441.2" y="196" width="150" height="84" rx="12" fill="#161b22" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
<text x="516.2" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Lock</text>
<text x="516.2" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">fix mode: start, lock</text>
<rect x="449.2" y="187" width="32" height="17" rx="8.5" fill="#3fb950"/><text x="465.2" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">RUN</text>
<rect x="545.2" y="271" width="38" height="17" rx="8.5" fill="#f85149"/><text x="564.2" y="283.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">HARD</text>
<line x1="594.2" y1="238" x2="626.8" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="705.8" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">code only. Never edit, skip</text>
<text x="705.8" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">or weaken the test to get to</text>
<text x="705.8" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">green</text>
<rect x="630.8" y="196" width="150" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="705.8" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Change the code</text>
<text x="705.8" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">least code to pass</text>
<rect x="638.8" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="651.3" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<line x1="783.8" y1="238" x2="816.4" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="895.4" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">run the test again and show</text>
<text x="895.4" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">it passing, then run every</text>
<text x="895.4" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">test and show that too</text>
<rect x="820.4" y="196" width="150" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4"/>
<text x="895.4" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Show it passing</text>
<text x="895.4" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">then the whole suite</text>
<rect x="828.4" y="187" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="840.9" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<line x1="973.4" y1="238" x2="1006" y2="238" stroke="#9da7b3" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1085" y="140" text-anchor="middle" font-size="12" fill="#9da7b3">refactor with the tests</text>
<text x="1085" y="155" text-anchor="middle" font-size="12" fill="#9da7b3">green, then verify, review</text>
<text x="1085" y="170" text-anchor="middle" font-size="12" fill="#9da7b3">and commit as usual</text>
<rect x="1010" y="196" width="150" height="84" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1085" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Stop fix mode</text>
<text x="1085" y="252" text-anchor="middle" font-size="12" fill="#9da7b3">tests unlocked</text>
<rect x="1018" y="187" width="32" height="17" rx="8.5" fill="#3fb950"/><text x="1034" y="199.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">RUN</text>
<path d="M 705.8 282 V 324 H 137 V 284" fill="none" stroke="#e3b341" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-wrong)"/>
<text x="161" y="341" font-size="12.5" fill="#e3b341">TEST LOOKS WRONG: the assistant stops, says why, and YOU decide. A changed test starts</text>
<text x="161" y="356" font-size="12.5" fill="#e3b341">again here</text>
<path d="M 895.4 282 V 380 H 727.8 V 284" fill="none" stroke="#f0883e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-again)"/>
<text x="741.8" y="397" font-size="12.5" fill="#f0883e">STILL FAILING: keep changing the code, not the test</text>
<text x="37" y="410" font-size="15" font-weight="700" fill="#e6edf3">What each profile changes</text>
<rect x="37" y="428" width="38" height="17" rx="8.5" fill="#6e7681"/><text x="56" y="440.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">SOLO</text>
<text x="87" y="441" font-size="12.5" fill="#9da7b3">tests.tdd = bugs: a bug fix always starts with a failing test. New logic is test-first only in a bucket the plan marks TDD: yes. The guard is</text>
<text x="87" y="457" font-size="12.5" fill="#9da7b3">off: the rule says never weaken a test, but nothing blocks it.</text>
<rect x="37" y="472" width="38" height="17" rx="8.5" fill="#a371f7"/><text x="56" y="484.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">TEAM</text>
<text x="87" y="485" font-size="12.5" fill="#9da7b3">tests.tdd = on: bug fixes and all new logic start with a failing test. The guard is on: in fix mode the hook refuses edits to existing test</text>
<text x="87" y="501" font-size="12.5" fill="#9da7b3">files (HARD).</text>
<rect x="37" y="516" width="32" height="17" rx="8.5" fill="#db61a2"/><text x="53" y="528.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">ORG</text>
<text x="81" y="529" font-size="12.5" fill="#9da7b3">Same test-first rules as team. What org adds is around it: success measurements in the plan, a docs check that blocks the commit, and a review</text>
<text x="81" y="545" font-size="12.5" fill="#9da7b3">record the push hook requires.</text>
<rect x="37" y="564" width="32" height="17" rx="8.5" fill="#e3b341"/><text x="53" y="576.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">YOU</text>
<text x="79" y="577" font-size="12.5" fill="#9da7b3">a person decides or acts: approves, asks, pushes, merges</text>
<rect x="597" y="564" width="25" height="17" rx="8.5" fill="#58a6ff"/><text x="609.5" y="576.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">AI</text>
<text x="632" y="577" font-size="12.5" fill="#9da7b3">the assistant, working under the rules and skills</text>
<rect x="37" y="590" width="32" height="17" rx="8.5" fill="#3fb950"/><text x="53" y="602.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d1117">RUN</text>
<text x="79" y="603" font-size="12.5" fill="#9da7b3">a script, a git hook or a CI job</text>
<rect x="597" y="590" width="38" height="17" rx="8.5" fill="#f85149"/><text x="616" y="602.2" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">HARD</text>
<text x="645" y="603" font-size="12.5" fill="#9da7b3">something blocks (only where the hook or tool is installed)</text>
<rect x="37" y="616" width="34" height="17" rx="6" fill="none" stroke="#9da7b3" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="81" y="629" font-size="12.5" fill="#9da7b3">dashed box: happens only in some cases (the note says when)</text>
<text x="37" y="656" font-size="12.5" fill="#9da7b3">Never skip, delete, weaken or loosen a failing test to get to green. If a test looks wrong, the assistant stops and asks you.</text>
</svg>
