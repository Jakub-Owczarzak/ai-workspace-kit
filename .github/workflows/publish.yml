name: publish

# Publishes to npm when a version tag is pushed. Nothing else publishes: a tag is a deliberate human act.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Rehearsal: Actions > publish > Run workflow (dry run is on by default). It runs every check and
# "npm publish --dry-run", and publishes nothing. See RELEASING.md for the one-time setup and the steps.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse only: run every check and "npm publish --dry-run"'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: The tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION. Nothing was published."
            exit 1
          fi
      - name: The tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main. Merge first, then tag. Nothing was published."
            exit 1
          fi
      - name: Kit tests
        run: npm test
      - name: Install smoke test (pack, npx init, apply, apply again)
        run: node scripts/ci-smoke.mjs
      - name: What would ship
        run: npm pack --dry-run

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # An environment named "npm" lets the owner add "required reviewers" in the repository settings, which turns
    # this job into a manual approval step. Without that setting it runs straight away.
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing: npm logs in with a short-lived identity token, no stored secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later (Node 22 ships an older npm).
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      # A tag for a version that is already on npm (for example the first release, published by hand) must not
      # fail the run: npm never lets a version be published twice.
      - name: Is this version already on npm?
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm. Nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is not on npm yet."
          fi
      - name: Publish with trusted publishing (no token is stored in this repository)
        if: steps.published.outputs.already != 'true'
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          FLAGS=""
          # Provenance needs a public repository; skip it while the repository is private.
          if [ "$REPOSITORY_IS_PRIVATE" = "false" ]; then FLAGS="$FLAGS --provenance"; fi
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; echo "Dry run: nothing will be published."; fi
          npm publish $FLAGS
