name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portability:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Kit tests
        run: npm test
      - name: Install smoke test (pack, npx init, npx init again)
        run: node scripts/ci-smoke.mjs
